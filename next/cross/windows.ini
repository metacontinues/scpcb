# windows x86_64 via clang + the mingw-w64 sysroot (arch: pacman -S mingw-w64-gcc, for its headers/crt/libgcc).
# used by `TARGET=windows ./setup.sh`. needs angle's libEGL.dll + libGLESv2.dll next to the exe at runtime
[binaries]
c = ['clang', '--target=x86_64-w64-mingw32']
ar = 'llvm-ar'
windres = 'llvm-windres'

[host_machine]
system = 'windows'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
